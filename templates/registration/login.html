{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>登录｜基于LLM的智慧教学资源智能调度系统</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Display:wght@100..900&family=Source+Serif+4:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'teaching/teaching.css' %}">
</head>
<body class="auth-page">
    <main class="auth-card">
            
            <a class="brand" href="/"><span class="brand-mark">AI</span><span>基于LLM的智慧教学资源<span class="brand-sub">智能调度系统</span></span></a>
            
            <h1>登录系统</h1>
            <p>提交教学需求，查看智能建议与排程结果。</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="button primary" type="submit">登录</button>
            </form>
            <p><a href="{% url 'signup' %}">还没有账号？注册</a></p>
    </main>
</body>
</html>
